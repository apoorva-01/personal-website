name: Refresh open-source ledger

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: oss-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Token diagnostics (temporary)
        env:
          TK: ${{ secrets.OSS_PAT }}
        run: |
          echo "OSS_PAT present: $([ -n "$TK" ] && echo yes || echo no)"
          echo "-- classic token scopes (blank = fine-grained or no repo scope) --"
          curl -sS -D - -o /dev/null -H "Authorization: Bearer $TK" https://api.github.com/user | grep -i "^x-oauth-scopes:" || echo "(no x-oauth-scopes header)"
          echo "-- authenticated login --"
          curl -sS -H "Authorization: Bearer $TK" https://api.github.com/user | grep -o '"login": *"[^"]*"' | head -1
          echo "-- can it read the private repo? (200 = yes, 404 = no) --"
          curl -sS -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer $TK" https://api.github.com/repos/mendygo-tech/Auditing_Evaluation_Platform

      - name: Rebuild assets/oss.json
        env:
          # GITHUB_TOKEN reads public PR/discussion data. If the discussions
          # query ever gets rate-limited, add a fine-grained PAT as OSS_PAT.
          GITHUB_TOKEN: ${{ secrets.OSS_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/build-oss-data.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/oss.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/oss.json
          git commit -m "chore: refresh open-source ledger"
          git push
