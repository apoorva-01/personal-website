<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing — Apoorva Verma</title>
<link rel="icon" type="image/jpeg" href="/assets/apoorva.jpg">
<meta name="robots" content="noindex">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0e11;--text-3:#9aa0a8;--accent:#ff4b26;--grid:rgba(255,255,255,.045)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text-3);font-family:'IBM Plex Mono',monospace;display:grid;place-items:center;min-height:100vh}
  .grid{position:fixed;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:64px 64px;pointer-events:none}
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(255,75,38,.4)}
  p{font-size:13px;letter-spacing:.04em}
</style>
</head>
<body>
  <div class="grid"></div>
  <p>Redirecting to <a href="/blog.html">/writing →</a></p>
  <script>location.replace("/blog.html");</script>
</body>
</html>
